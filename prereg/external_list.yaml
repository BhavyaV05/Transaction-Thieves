# External systems for Table 5a / E5 (plan.md 7.1). DRAFT v0 (T4). Locked at G3; after that, adding or dropping a
# system needs the TA. Code and licence status: docs/external_code_check.md (C/D), docs/t1_week0.md (A/B).

status: draft
backbone: e18                       # every LLM system uses the planner backbone chosen by E18 (configs/llm/default.yaml)
thinking: off                       # unless E18's thinking arm is adopted for every system
caps: configs/llm/default.yaml#limits   # same max_llm_calls, max_tokens (prompt), max_sim_time_days, eps per alert
gate_and_accountant: same as ours   # every ask_bank goes through the compliance gate and the privacy accountant
scores: [end_to_end, questions_only]
eval_set: {all: frozen_1000_subset, top_2_3_chosen_at_g4_on_val: full_test}

systems:
  # group, name, modes, tier, owner, implementation
  - {group: A, name: multi_gnn,        modes: [one_bank, see_everything], tier: core,      owner: T1, impl: "official (Apache-2.0)"}
  - {group: A, name: fraudgt,          modes: [one_bank, see_everything], tier: secondary, owner: T1, impl: "official, separate checkout (no licence)"}
  - {group: A, name: mega_gnn,         modes: [one_bank, see_everything], tier: secondary, owner: T1, impl: "official (Apache-2.0)"}
  - {group: A, name: exstraqt,         modes: [see_everything],           tier: stretch,   owner: T1, impl: "official if authors allow (no licence); reference for the ~80 F1"}
  - {group: B, name: dp_fedavg_gnn,    modes: [30_clients],               tier: core,      owner: T1, impl: "Flower + Opacus"}
  - {group: B, name: tian_2025,        modes: [as_published],             tier: secondary, owner: T1, impl: "official if authors allow (no licence), else reimplementation"}
  - {group: C, name: torres,           modes: [native, ported],           tier: core,      owner: T4, impl: "reimplementation (no code)"}
  - {group: C, name: sharma,           modes: [native, ported],           tier: core,      owner: T4, impl: "official port (MIT)"}
  - {group: C, name: co_investigator,  modes: [native, ported],           tier: secondary, owner: T2, impl: "reimplementation (no code)"}
  - {group: C, name: finfre_rag,       modes: [native, ported],           tier: secondary, owner: T2, impl: "reimplementation (no code yet)"}
  - {group: D, name: react,            modes: [ported],                   tier: core,      owner: T3, impl: "reimplementation (official MIT, nothing copied)"}
  - {group: D, name: reflexion,        modes: [ported],                   tier: core,      owner: T3, impl: "reimplementation (shared eps and call budget across trials)"}
  - {group: D, name: rewoo,            modes: [ported],                   tier: core,      owner: T3, impl: "reimplementation (2 LLM calls per alert)"}
  - {group: D, name: lats,             modes: [ported],                   tier: secondary, owner: T3, impl: "official adapted (MIT)"}
  - {group: D, name: llmcompiler,      modes: [ported],                   tier: secondary, owner: T3, impl: "official adapted (MIT)"}
  - {group: D, name: dspy_react,       modes: [ported],                   tier: secondary, owner: T3, impl: "DSPy MIPROv2, objective Brier, same val data as our fine-tuning"}
  - {group: D, name: debate_autogen,   modes: [ported],                   tier: secondary, owner: T4, impl: "reimplementation from the paper (debate: no licence); AG2 not used, its LLM calls would bypass the shared caps"}
  - {group: D, name: uot,              modes: [ported],                   tier: secondary, owner: T4, impl: "reimplementation (no licence)"}
  - {group: D, name: bed_llm,          modes: [ported],                   tier: secondary, owner: T4, impl: "reimplementation (no code)"}

# Settings to fix before the first run of each reimplementation (not tuned after seeing results):
fixed_choices:
  sharma: {max_iterations: 8, temperature: 0.1, tool_calls: "schema-constrained JSON (no vLLM tool parser)", verdict_to_probability: "per-class launder rate on val fit part (defaults fraud 0.9 / not_fraud 0.1 / escalate p0)", variants: [agent, governed], governed_thresholds: [0.35, 0.65], case_memory: "train alerts, p0 + shape buckets, 2 nearest per class"}
  torres: {quotas: {policy: 3, context: 1, transaction: 20, similar_case: 4}, quotas_status: "default; may be set on val before G3", disposition_to_probability: "confidence to the chosen disposition, rest split equally; P(escalate) + 0.5 * P(monitor)", repair_budget: 1, counterfactual_edit_budget: 2, counterfactuals: "measured and logged, do not change the decision", ported: "one question round, up to 3 questions, answers become evidence items", temperature: 0.0}
  co_investigator: {status: "reimplementation of a simplified pipeline; the paper gives no prompts, models, thresholds or decision", agents: "planner picks up to 4 of 6 typology agents (dispute agent dropped: AMLworld has no disputes); native has no external intelligence; ported = up to 3 partner questions", memory: "regulatory + typology = lookup_rules; historical outcomes = CaseMemory of TRAIN alerts", verdict_to_probability: "the narrative agent's stated confidence if the validator accepts the narrative after at most 1 revision, else None (scored as p0)", validator: "Torres-style rule check (citations, amounts, dates) + 1 LLM coherence call", revise_budget: 1, temperature: 0.0}
  finfre_rag: {status: "reimplementation; paper pipeline as published", features_kept: 10, importance: "Random Forest (univariate |AUC-0.5| fallback, logged)", exemplars: 20, retrieval: "categorical equality filters by importance while non-empty, then cosine on z-scored numeric features", pool: "TRAIN alerts with labels only", score_to_probability: "fixed table {1: 0.05, 2: 0.2, 3: 0.5, 4: 0.8, 5: 0.95}; paper threshold (>= 4 is fraud) also logged; fit_score_map may replace it on TRAIN-only data before G3", repair_calls: 1, temperature: 0.0, temperature_note: "paper uses 0.6; we sample every system alike (fairness protocol)", ported: "one question round, up to 3 questions, answers appended to the current case"}
  uot: {status: "reimplementation from the paper (repo has no licence, nothing copied)", depth: 1, depth_note: "paper builds a multi-level simulation tree; ~3^d calls exceed the call cap", candidates_per_step: 3, calls_per_step: 1, hidden_variable: "binary launder / clean", score: "expected information gain (exact entropy) on the current belief", belief_update: "the model's own simulated answer likelihoods (not the back-tested LRs)", initial_belief: "alert p0", eig_stop_bits: 0.02, max_steps: 6, answer_cells: {bool: [false, true], count_and_set_count: ["0", "1-2", "3-5", "6+"], kary: "its options"}, probability_floor: 0.001, final_probability: "the belief", malformed_json: "one retry, then the step is skipped", temperature: 0.0}
  bed_llm: {status: "reimplementation from the paper (no code released)", hypotheses_k: 4, candidates_per_step: 3, calls_per_step: 2, calls_note: "(a) sample K labelled hypotheses given the history, (b) candidates + predicted answer-cell distribution per (hypothesis, question) + scores of past questions", target: "label (launder / clean) marginalised over the hypotheses", score: "expected information gain (exact entropy)", weights: "hypotheses reweighted by the model-predicted likelihood of the observed cells (probability floor 0.001)", eig_stop_bits: 0.02, max_steps: 5, answer_cells: {bool: [false, true], count_and_set_count: ["0", "1-2", "3-5", "6+"], kary: "its options"}, final_probability: "(K * weighted launder share + p0) / (K + 1), i.e. smoothing toward p0 with weight 1 particle", malformed_json: "one retry per call, then the step is skipped", temperature: 0.0}
  debate_autogen: {status: "reimplementation from Du et al. (ICML 2024); the official repo has no licence, nothing copied", ag2: "AG2 / AutoGen not used: its own LLM calls would bypass BudgetedClient and the shared caps", n_agents: 3, rounds: 2, rounds_note: "2 debate rounds after the initial one; calls = n_agents x (rounds + 1) = 9, capped by Limits.max_llm_calls", aggregation: "mean of the agents' last valid probabilities (the paper's majority vote adapted to a probability); None if no agent gave one", temperature: 0.7, temperature_note: "agents differ by sampling seed; at 0 they would be identical and there would be nothing to debate", ported: "questions proposed in a round are asked once through one shared Investigation (one eps budget, duplicates refused) in agent order; every answer is shown to all agents next round; none after the last round"}
