# E18: backbone size sweep (plan.md 6.11 and section 8; tracks.md 5.4). Owner: T3 (Akshat); decision rule: T4.
# Validation only. The decision rule below is copied into prereg/ and committed before stage 1 runs.
# hf_id: null = not checked yet; T3 fills it from the model card (docs/t3_week0.md). profile = the entry in
# configs/llm/serving.yaml that serves it (pinned revision); null = profile still to add before week 3.

candidates:
  - {name: qwen3-8b,           family: qwen,  params_b: 8,    active_b: 8,   quant: awq,          stack: vllm,      hf_id: Qwen/Qwen3-8B-AWQ,         set: core,    profile: qwen3-8b}
  - {name: gemma4-12b,         family: gemma, params_b: 12,   active_b: 12,  quant: qat-w4a16,    stack: vllm,      hf_id: google/gemma-4-12B-it-qat-w4a16-ct, set: core, profile: gemma4-12b}
  - {name: qwen3-14b,          family: qwen,  params_b: 14,   active_b: 14,  quant: awq,          stack: vllm,      hf_id: Qwen/Qwen3-14B-AWQ,        set: core, profile: qwen3-14b}
  - {name: phi4-reasoning,     family: phi,   params_b: 14,   active_b: 14,  quant: 4bit,         stack: vllm,      hf_id: microsoft/Phi-4-reasoning, set: if_time, profile: null}
  - {name: gpt-oss-20b,        family: gpt-oss, params_b: 21, active_b: 3.6, quant: mxfp4,        stack: llama.cpp, hf_id: ggml-org/gpt-oss-20b-GGUF, set: core,    profile: null}   # vLLM OOMs at weight allocation beside the desktop (docs/t3_week0.md section 4)
  - {name: gemma4-26b-a4b,     family: gemma, params_b: 25.2, active_b: 3.8, quant: UD-IQ4_XS,    stack: llama.cpp, hf_id: unsloth/gemma-4-26B-A4B-it-GGUF, set: core, profile: null}   # no vLLM 4-bit build; Google's QAT GGUF (14.4 GB) does not fit beside the desktop
  - {name: qwen3.8-27b-q3,     family: qwen,  params_b: 27,   active_b: 27,  quant: UD-Q3_K_XL,   stack: llama.cpp, hf_id: null,                      set: core, profile: null}   # the CIBC reasoning model
  - {name: gemma4-31b-q3,      family: gemma, params_b: 31,   active_b: 31,  quant: Q3_K,         stack: llama.cpp, hf_id: null,                      set: if_time, profile: null}  # only if it fits at the context cap

parity:                       # identical for every candidate
  prompt: planner_compose     # same prompt text, each model's own chat template
  temperature: 0.0
  max_prompt_tokens: 6000     # = llm.limits.max_tokens (a prompt cap)
  thinking: false             # stage 1 and the default arm; gpt-oss at reasoning_effort: low
  per_model_prompt_tuning: false
  evidence_view: top40        # same evidence for every candidate

stage1:
  alerts: 160                 # every askable HI-Medium val eval alert (prereg amended 2026-10-25), fixed seed
  min_valid_dsl: 0.95
  drop_if_clearly_worse: true # 95% cluster-bootstrap CI of Brier(model) - Brier(best) above 0
stage2:
  top_k: 3
  alerts: 460                 # every askable HI-Medium val alert, eval first (--val-part all); 160 detect ~0.05 Brier, 460 ~0.03
  thinking_arm: {models: winner, alerts: same, thinking: true, max_output_tokens_per_step: 1024}   # adopted for every system only if it wins by > margin within latency
decision:
  rule: smallest_equivalent_to_best   # CI upper bound of Brier(model) - Brier(best) below the plan.md 9.3 margin
  fallback: best_meeting_latency
  latency_s_per_alert: [8, 20]        # on the reference machine
  ci_level: 0.95
  n_boot: 10000
seed: 0

# --- run settings for scripts/run_e18.py (T3). Nothing above is changed; the prereg rule wins on any disagreement. ---
reference_machine: t3-5070ti  # latency and GPU-s count only from here (ftm/eval/runlog.py)
data: hi_medium               # HI-Medium val alerts (docs/t4_decisions_week2.md item 9); the val part is a required CLI arg
backtest: data/backtest/hi_medium/7df6bad5337d/lr_table.jsonl   # the realistic HI-Medium table every LLM run uses (440 rows, 23 accepted)
gpt_oss_thinking_on_effort: medium   # gpt-oss has no thinking switch: the "on" arm raises reasoning_effort from low
budget:                       # plan.md section 12 (17-31 GPU-h): only used by --dry-run
  plan_total_gpu_h: [17, 31]
  thinking_arm_gpu_h: [5, 9]  # for 500 alerts

# One server at a time on the 16 GB GPU: serve a candidate, then `run_e18.py stage1 --only <name>`. The driver skips
# a candidate whose endpoint does not list `served_model`. size_gb: null = estimated from params x bits per weight.
# endpoint: null = FTM_LLM_ENDPOINT. revision: null = to pin from the model card before serving (docs/t3_week0.md).
# llama.cpp candidates (stack: llama.cpp) are served by `scripts/serve_llm.py --model <name>` (backend llamacpp): gguf_repo +
# gguf_file are resolved in the HF cache (FTM_HF_HOME), never downloaded; max_model_len -> --ctx-size. gguf_file names
# were checked against the repo listings on 2026-10-24 (HF API), when these revisions were pinned.
serving:
  qwen3-8b:        {served_model: qwen3-8b,        revision: 4da05a8edb55c6046cce958586c33b61da07bb79, max_model_len: 8192, size_gb: 6.0,  endpoint: null}
  gemma4-12b:      {served_model: gemma4-12b,      revision: 1d2c2d7f2466070e69d6fb3fd5ce9a7d75f2f6ee, max_model_len: 8192, size_gb: 10.3, endpoint: null, hf_id: google/gemma-4-12B-it-qat-w4a16-ct}
  qwen3-14b:       {served_model: qwen3-14b,       revision: 31c69efc29464b6bb0aee1398b5a7b50a99340c3, max_model_len: 8192, size_gb: 10.0, endpoint: null, hf_id: Qwen/Qwen3-14B-AWQ}
  phi4-reasoning:  {served_model: phi4-reasoning,  revision: 1de18ec97600877ce63dbf60c73b998da99f0195, max_model_len: 8192, size_gb: null, endpoint: null}
  gpt-oss-20b:     {served_model: gpt-oss-20b,     revision: 15dcfc7e7c608c6161507211ed43c5b590801b4b, max_model_len: 8192, size_gb: 12.1, endpoint: null, hf_id: ggml-org/gpt-oss-20b-GGUF,
                   gguf_repo: ggml-org/gpt-oss-20b-GGUF, gguf_file: gpt-oss-20b-MXFP4.gguf, reasoning_format: auto,
                   chat_template_kwargs: {reasoning_effort: low}}   # parity.thinking: gpt-oss has no switch, low effort is the off arm
  gemma4-26b-a4b:  {served_model: gemma4-26b-a4b,  revision: c099eb48e663fd284577b04978a94ffccb261841, max_model_len: 8192, size_gb: 13.6, endpoint: null, hf_id: unsloth/gemma-4-26B-A4B-it-GGUF,
                   gguf_repo: unsloth/gemma-4-26B-A4B-it-GGUF, gguf_file: gemma-4-26B-A4B-it-UD-IQ4_XS.gguf}
  qwen3.8-27b-q3:  {served_model: qwen3.8-27b-q3,  revision: 4ca720788d1e01f1bff70c033e0d0028fd02e502, max_model_len: 8192, size_gb: 13.1, endpoint: null, hf_id: unsloth/Qwen3.8-27B-GGUF,
                   gguf_repo: unsloth/Qwen3.8-27B-GGUF, gguf_file: Qwen3.8-27B-UD-Q3_K_XL.gguf}
  gemma4-31b-q3:   {served_model: gemma4-31b-q3,   revision: c1ac76e99d5513b141e8adde7288b85c3f9c32ec, max_model_len: 8192, size_gb: 14.7, endpoint: null, hf_id: google/gemma-4-31B-it,
                   gguf_repo: unsloth/gemma-4-31B-it-GGUF, gguf_file: gemma-4-31B-it-Q3_K_M.gguf}
