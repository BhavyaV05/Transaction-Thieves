# Expert question list, SPECS v0 (plan.md 5.3: "≈60, two teammates write them from red-flag reports, expressed in
# the DSL"). Owner: T4 (Shreyas) drafts the specs; T2 (Bhavya) turns each one into a DSL program once grammar v0
# exists, and checks the sensitivity. Used by the simple planners (C9), the fixed-list ablation and the strategy
# library. Every family cites the red flags it comes from (configs/compliance/red_flags.yaml).
#
# Conventions (expressed in DSL v0, ftm/dsl/expert.py):
#   SUBJ            the alerted transaction's party that the ASKED partner bank holds: ALERT.receiver for an
#                   outgoing alert, ALERT.sender for an incoming one. A partner only answers about its own accounts.
#   ALERT.payers    accounts that paid ALERT.receiver in the 72 h before the alert (home bank's view, a set)
#   ALERT.payees    accounts ALERT.sender paid in the 72 h before the alert (home bank's view, a set)
#   window_h        hours after the alert time ("after") or before it ("before"). An "after" window is answered
#                   only up to the partner's answer time, so a reply after 12 h sees only 12 h of a 24 h window.
#   No account id, alias, date or amount literal ever appears in a question (the gate blocks them); amounts are
#   only thresholds or multiples of the alerted amount.
# kind:        bool | count | kary | set_count (ftm.types.AnswerKind)
# sensitivity: change of the true answer when one transaction is added or removed (the DP protection unit).
#              T2's sensitivity function (ftm.dsl) is authoritative; values here were checked against it (2026-10-23).
# status:      ok (default) | restricted (registered in the DSL but never askable)
# expect:      direction we expect for laundering vs clean, which back-testing then confirms or rejects.

families:
  - family: pass_through
    red_flags: [RF-US-03, RF-SG-02, RF-SG-08, RF-SG-09]
    typologies: [stack, fan_in, gather_scatter, scatter_gather]
    kind: bool
    sensitivity: 1
    template: "Did SUBJ send on at least {frac:.0%} of what it received, within {window_h} h after the alert?"
    expect: "yes more often for laundering"
    variants:
      - {frac: 0.8, window_h: 24}
      - {frac: 0.5, window_h: 24}
      - {frac: 0.8, window_h: 72}
      - {frac: 0.5, window_h: 72}
  - family: onward_bank
    red_flags: [RF-US-03, RF-SG-13, RF-US-26]
    typologies: [stack, scatter_gather, gather_scatter]
    kind: kary
    sensitivity: 1
    template: "Which of these banks {banks} received most of SUBJ's outgoing money within {window_h} h after the alert (or none)?"
    expect: "a named bank more often for laundering; the answer also tells the planner whom to ask next"
    variants:
      - {banks: "up to 4 banks chosen by the planner", window_h: 24}
      - {banks: "up to 4 banks chosen by the planner", window_h: 72}
  - family: time_to_forward
    red_flags: [RF-SG-02, RF-US-03]
    typologies: [stack, fan_in]
    kind: kary
    sensitivity: 1
    template: "How soon after the alert did SUBJ send on at least half of the alerted amount: under 1 h, 1-6 h, 6-24 h, or later/never?"
    expect: "faster for laundering"
    variants:
      - {}
  - family: fan_in_count
    red_flags: [RF-US-03, RF-SG-06, RF-SG-10, RF-SG-11, RF-US-15]
    typologies: [fan_in, gather_scatter]
    kind: count
    sensitivity: 1
    template: "How many distinct accounts paid SUBJ in the {window_h} h before the alert?"
    expect: "higher for laundering"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: fan_in_many
    red_flags: [RF-SG-11, RF-SG-10]
    typologies: [fan_in]
    kind: bool
    sensitivity: 1
    template: "Did at least {k} distinct accounts pay SUBJ in the {window_h} h before the alert?"
    expect: "yes more often for laundering"
    variants:
      - {k: 5, window_h: 72}
  - family: fan_out_count
    red_flags: [RF-US-21, RF-US-18, RF-SG-16]
    typologies: [fan_out, scatter_gather]
    kind: count
    sensitivity: 1
    template: "How many distinct accounts did SUBJ pay within {window_h} h after the alert?"
    expect: "higher for laundering"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: fan_out_many
    red_flags: [RF-US-21]
    typologies: [fan_out]
    kind: bool
    sensitivity: 1
    template: "Did SUBJ pay at least {k} distinct accounts within {window_h} h after the alert?"
    expect: "yes more often for laundering"
    variants:
      - {k: 5, window_h: 72}
  - family: gather_across_banks
    red_flags: [RF-SG-13, RF-US-09]
    typologies: [gather_scatter, scatter_gather, fan_in]
    kind: count
    sensitivity: 1
    template: "From how many distinct banks did SUBJ receive money in the {window_h} h before the alert?"
    expect: "higher for laundering"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: distinct_banks_out
    red_flags: [RF-US-22, RF-US-26]
    typologies: [fan_out, scatter_gather]
    kind: count
    sensitivity: 1
    template: "To how many distinct banks did SUBJ send money within {window_h} h after the alert?"
    expect: "higher for laundering"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: small_inflows
    red_flags: [RF-US-09, RF-SG-06]
    typologies: [fan_in, scatter_gather]
    kind: count
    sensitivity: 1
    template: "How many payments below {amount} did SUBJ receive in the {window_h} h before the alert?"
    expect: "higher for laundering"
    variants:
      - {amount: 3000, window_h: 72}
      - {amount: 10000, window_h: 72}
  - family: just_below_threshold
    red_flags: [RF-US-16, RF-US-10, RF-US-08]
    typologies: []
    kind: count
    sensitivity: 1
    template: "How many of SUBJ's transfers in the {window_h} h around the alert were between 9,000 and 9,999 (any currency)?"
    expect: "higher for laundering (structuring)"
    variants:
      - {window_h: 72}
      - {window_h: 168}
  - family: round_amounts
    red_flags: [RF-US-01]
    typologies: []
    kind: count
    sensitivity: 1
    template: "How many of SUBJ's transfers in the {window_h} h around the alert were whole multiples of {unit}?"
    expect: "higher for laundering"
    variants:
      - {unit: 1000, window_h: 72}
      - {unit: 100, window_h: 72}
  - family: cash_format
    red_flags: [RF-US-08, RF-SG-04, RF-SG-05, RF-SG-16]
    typologies: [stack]
    kind: count
    sensitivity: 1
    template: "How many of SUBJ's transfers in the {window_h} h around the alert used the Cash payment format?"
    expect: "higher for laundering"
    variants:
      - {window_h: 72}
      - {window_h: 168}
  - family: return_to_home_bank
    red_flags: [RF-US-14, RF-US-13]
    typologies: [cycle]
    kind: bool
    sensitivity: 1
    template: "Did SUBJ send any money to an account at the home bank within {window_h} h after the alert?"
    expect: "yes more often for laundering (money coming back)"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: payees_hit_home_payers
    red_flags: [RF-US-14, RF-US-13, RF-US-26]
    typologies: [cycle, scatter_gather]
    kind: set_count
    sensitivity: 1
    template: "Of the accounts SUBJ paid within {window_h} h after the alert, how many are in ALERT.payers?"
    expect: "above 0 more often for laundering (the circle closes); the proposal's set-count example"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: payers_hit_home_payees
    red_flags: [RF-US-09, RF-US-26, RF-SG-13]
    typologies: [scatter_gather, gather_scatter]
    kind: set_count
    sensitivity: 1
    template: "Of the accounts that paid SUBJ in the {window_h} h before the alert, how many are in ALERT.payees?"
    expect: "above 0 more often for laundering (money scattered from the sender gathers at SUBJ)"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: matching_amount_out
    red_flags: [RF-SG-09, RF-US-05]
    typologies: [stack, cycle]
    kind: bool
    sensitivity: 1
    template: "Did SUBJ send out, within 24 h after the alert, a single amount within {tol:.0%} of the alerted amount?"
    expect: "yes more often for laundering"
    variants:
      - {tol: 0.01}
      - {tol: 0.05}
      - {tol: 0.10}
  - family: repeated_amounts
    red_flags: [RF-US-05]
    typologies: [random, stack]
    kind: count
    sensitivity: 2   # adding one transaction can complete a pair, so the count can rise by 2
    template: "How many of SUBJ's transfers in the {window_h} h around the alert repeat another of its transfers within 1% in amount?"
    expect: "higher for laundering"
    variants:
      - {window_h: 72}
      - {window_h: 168}
  - family: velocity_balanced
    red_flags: [RF-SG-08, RF-SG-02]
    typologies: [stack, gather_scatter]
    kind: bool
    sensitivity: 1
    template: "Over the {window_h} h around the alert, were SUBJ's total outflows between 90% and 110% of its total inflows, with inflows at least the alerted amount?"
    expect: "yes more often for laundering"
    variants:
      - {window_h: 48}
      - {window_h: 144}
  - family: cross_currency_out
    red_flags: [RF-US-04, RF-SG-07, RF-SG-15, RF-US-22]
    typologies: [stack, fan_out]
    kind: bool
    sensitivity: 1
    template: "Did SUBJ send money on in a currency different from the alerted payment's, within {window_h} h after the alert?"
    expect: "yes more often for laundering"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: dormant_then_active
    red_flags: [RF-US-19, RF-SG-03, RF-SG-07, RF-US-11]
    typologies: [stack]
    kind: bool
    sensitivity: 1
    template: "Did SUBJ have no transfers at all in the {days} days before the 72 h window around the alert?"
    expect: "yes more often for laundering (a dormant account wakes up)"
    variants:
      - {days: 3}
      - {days: 7}
  - family: new_account
    red_flags: [RF-US-19]
    typologies: [stack, fan_in]
    kind: bool
    sensitivity: 1
    template: "Was SUBJ's first-ever transfer at the partner bank within the {days} days before the alert?"
    expect: "yes more often for laundering"
    variants:
      - {days: 2}
      - {days: 5}
  - family: volume_spike
    red_flags: [RF-US-11, RF-US-23, RF-SG-14]
    typologies: [fan_in, stack]
    kind: bool
    sensitivity: 1
    template: "Was SUBJ's total inflow in the 24 h before the alert at least {mult}x its average daily inflow over the 7 days before that?"
    expect: "yes more often for laundering"
    variants:
      - {mult: 3}
      - {mult: 5}
      - {mult: 10}
  - family: same_entity_transfers
    red_flags: [RF-US-06, RF-US-13, RF-SG-01, RF-US-17]
    typologies: [cycle, stack, bipartite]
    kind: count
    sensitivity: 1
    template: "How many transfers in the {window_h} h around the alert moved money between SUBJ and other accounts of SUBJ's own entity?"
    expect: "higher for laundering"
    variants:
      - {window_h: 72}
      - {window_h: 168}
  - family: entity_accounts
    red_flags: [RF-US-17, RF-SG-01]
    typologies: [bipartite, scatter_gather]
    kind: count
    sensitivity: 0   # a property of the customer record, not of transactions
    status: restricted   # decided (T2 + T4, 2026-10-23): not askable. Transaction-level DP does not cover customer records
    template: "How many accounts does SUBJ's entity hold at the partner bank?"
    expect: "higher for laundering"
    variants:
      - {}
  - family: internal_chain
    red_flags: [RF-US-26, RF-US-27]
    typologies: [stack, bipartite]
    kind: count
    sensitivity: 3   # = chain_length's max_hops (one added transfer can join two chains); T2's DSL is authoritative
    template: "Following the money from SUBJ through accounts at the same partner bank, within {window_h} h after the alert, how many hops long is the longest chain?"
    expect: "longer for laundering (layering inside one bank)"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: new_counterparties_out
    red_flags: [RF-SG-14, RF-US-27]
    typologies: [fan_out, stack]
    kind: count
    sensitivity: 1
    template: "How many of the accounts SUBJ paid within {window_h} h after the alert had SUBJ never paid before?"
    expect: "higher for laundering"
    variants:
      - {window_h: 24}
      - {window_h: 72}
  - family: payees_pay_each_other
    red_flags: [RF-US-24]
    typologies: [bipartite, cycle]
    kind: bool
    sensitivity: 1
    template: "Within {window_h} h after the alert, did at least two of the accounts SUBJ paid also pay each other?"
    expect: "yes more often for laundering (a closed group)"
    variants:
      - {window_h: 72}
  - family: inflow_vs_alert
    red_flags: [RF-US-12, RF-SG-14]
    typologies: [fan_in]
    kind: kary
    sensitivity: 1
    template: "In the 72 h before the alert, was SUBJ's total inflow under 1x, 1-3x, 3-10x or over 10x the alerted amount?"
    expect: "higher buckets for laundering"
    variants:
      - {}
