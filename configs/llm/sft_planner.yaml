# QLoRA SFT of the planner student on distilled teacher steps (T3, tracks.md 5.4 step 3, plan.md 6.11).
# Takes the whole 16 GB GPU: block GPU_CALENDAR.md first (the 8B server on the 5070 Ti is down meanwhile).
task: planner
base_model: Qwen/Qwen3-8B
revision: b968826d9c46dd6066d109eabc6255188de91218
load_in_4bit: true
max_seq_length: 7168            # 6,000-token prompt cap + the JSON answer, with headroom
enable_thinking: false          # same chat template setting as inference (docs/t3_week0.md section 5)
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 2
  learning_rate: 2.0e-4
  per_device_batch_size: 1
  grad_accum: 16
  warmup_ratio: 0.03
  weight_decay: 0.0
  optim: adamw_8bit
  responses_only: true          # loss on the assistant JSON only
seeds: [0, 1, 2]                # plan rule: >= 3 seeds for anything trained
output_dir: models/planner_sft  # gitignored; trained weights are never released (plan.md 10)
