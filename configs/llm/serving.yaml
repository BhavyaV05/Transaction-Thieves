# Serving profiles for scripts/serve_llm.py (T3, tracks.md 5.3, docs/hardware.md section 5).
# Rule: every serving machine uses the SAME vLLM version, checkpoint revision and server flags. Only timing differs.
# Revisions are the Hugging Face commit hashes checked on 2026-10-19 (docs/t3_week0.md section 2).

vllm_version: 0.31.0                       # pinned; 0.32.0 (2026-10-18) is too new to pin yet
docker_image: vllm/vllm-openai:v0.31.0     # ~10 GB compressed; pull only after moving Docker's disk image off C: (recipe)

# Bind address. Loopback by default. To share over the tailnet use `tailscale serve` (recipe) or set this to the
# machine's Tailscale 100.x address. serve_llm.py refuses wildcard and public addresses.
host: 127.0.0.1
port: 8000

# Hugging Face cache on the host. On Akshat's PC set FTM_HF_HOME=E:\hf_cache (keep weights off C:).
hf_home: ${oc.env:FTM_HF_HOME,${oc.env:HF_HOME,'~/.cache/huggingface'}}

# Flags shared by every profile (parity across machines).
common:
  seed: 0
  generation_config: vllm                  # ignore the model's own default sampling; the client sends temperature
  enable_prefix_caching: true

models:
  qwen3-8b:                                # planner + Group D backbone until E18 picks another (plan.md 6.11)
    repo: Qwen/Qwen3-8B-AWQ
    revision: 4da05a8edb55c6046cce958586c33b61da07bb79
    licence: apache-2.0
    max_model_len: 8192                    # >= Limits.max_tokens (6000 prompt) + room for the answer
    gpu_memory_utilization: 0.85           # was 0.90: on Linux with the KDE desktop (~1.6 GB VRAM) 0.90 fails the free-memory check
    reasoning_parser: qwen3
  qwen3-4b:                                # System 1 fast model base (C13) and harness smoke tests
    repo: Qwen/Qwen3-4B-AWQ
    revision: 74d4bd2bd4bff9cafc9345221320bffb08b406a3
    licence: apache-2.0
    max_model_len: 8192
    gpu_memory_utilization: 0.60
    reasoning_parser: qwen3
  gpt-oss-20b:                             # teacher candidate; takes the whole 16 GB GPU (block GPU_CALENDAR.md)
    repo: openai/gpt-oss-20b
    revision: 6cee5e81ee83917806bbde320786a8fb61efebee
    licence: apache-2.0
    max_model_len: 8192
    gpu_memory_utilization: 0.92
    reasoning_parser: null                 # vLLM handles the harmony format natively
  qwen3-14b:                               # E18 candidate (configs/experiments/e18_backbone_sweep.yaml)
    repo: Qwen/Qwen3-14B-AWQ
    revision: 31c69efc29464b6bb0aee1398b5a7b50a99340c3
    licence: apache-2.0
    max_model_len: 8192
    gpu_memory_utilization: 0.88           # 9.9 GB of AWQ weights; the rest is KV cache at the 8192 cap
    reasoning_parser: qwen3
  gemma4-12b:                              # E18 candidate: Google's own 4-bit QAT checkpoint (compressed-tensors W4A16)
    repo: google/gemma-4-12B-it-qat-w4a16-ct
    revision: 1d2c2d7f2466070e69d6fb3fd5ce9a7d75f2f6ee
    licence: apache-2.0
    max_model_len: 8192
    gpu_memory_utilization: 0.84           # was 0.88: OOM in a thinking-arm prefill (26 Oct, 15.8 GB peak beside the desktop); KV cache only
    reasoning_parser: gemma4               # added for the E18 thinking arm (26 Oct); a no-op with thinking off (stages 1-2 ran with null)
    extra_args: [--limit-mm-per-prompt, '{"image": 0, "audio": 0}']   # text only: no vision/audio encoder memory
  qwen3-8b-lora:                           # E16 (planner QLoRA): the AWQ Qwen3-8B above with LoRA enabled. Served alone it is the "same model
    repo: Qwen/Qwen3-8B-AWQ                #  prompted" arm; the adapters (trained as QLoRA on the bf16 base) are addressed by name in `model`.
    revision: 4da05a8edb55c6046cce958586c33b61da07bb79   # vLLM 0.31.0 has no bitsandbytes quantisation, so the bf16 base cannot be served 4-bit
    licence: apache-2.0
    max_model_len: 8192
    gpu_memory_utilization: 0.85
    reasoning_parser: qwen3
    max_lora_rank: 16
    lora_modules:                          # adapters trained by scripts/train_planner.py (gitignored, models/)
      planner-sft-s0: models/planner_sft/seed=0/adapter
      planner-sft-s1: models/planner_sft/seed=1/adapter
      planner-sft-s2: models/planner_sft/seed=2/adapter
  qwen3-4b-lora:                           # E10 (fast model): AWQ Qwen3-4B with LoRA enabled: the untuned base and the tuned adapters
    repo: Qwen/Qwen3-4B-AWQ
    revision: 74d4bd2bd4bff9cafc9345221320bffb08b406a3
    licence: apache-2.0
    max_model_len: 8192
    gpu_memory_utilization: 0.60
    reasoning_parser: qwen3
    max_lora_rank: 16
    lora_modules:
      fast-s0: models/fast_4b/seed=0/adapter
      fast-s1: models/fast_4b/seed=1/adapter
      fast-s2: models/fast_4b/seed=2/adapter
  qwen3-1.7b:                              # E10 small general-LLM baseline (untuned, bf16: small enough not to need a quantised build)
    repo: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    licence: apache-2.0
    max_model_len: 8192
    gpu_memory_utilization: 0.45
    reasoning_parser: qwen3
