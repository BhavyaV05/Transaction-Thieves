# Final run (G5) job settings, read by ftm/final/plan.py and scripts/run_final.py (T4). Docs: docs/t4_final_run.md.
# Owners fill in their commands below; everything else has a working default. Nothing here touches prereg/.
#
# An external_cmd job runs `cmd` (split with shlex, NO shell) from the repo root. It must write
#   {out}/runlog.parquet   a run-log v1 file (ftm/eval/runlog.py): one `verdict` row per alert in {alert_ids}, with
#                          system, variant, seed, split, alert_id, probability, p0 and the cost columns it has;
#                          the `label` column must stay EMPTY (the analysis fills labels in; a run log with labels fails the job)
# Placeholders: {out} {alert_ids} {alerts} {run_dir} {data} {seed} {system} {variant} {job_id} {machine} {run_id} {commit}
# FTM_FINAL_RUN=1 is set in the environment of the command. Its stdout/stderr go to files in the job directory.

data: hi_medium                  # headline dataset (HI-Medium test days 13-16 plus the tail, reported separately)
seeds: [0]                       # one seed for every job (temperature 0); add seeds here for all jobs at once

# Only for est_hours in the dry run, until the real test alert set is built (plan.md 6.3 projects 2,500-4,000).
n_alerts_estimate: {full_test: 3000, subset: 1000}

machines:
  gpu_s3: {speed: 1.0}                    # RTX 5070 Ti, the reference machine (timing counts only from here)
  gpu_s1: {speed: 0.5, enabled: true}     # RTX 3070 Ti, about half the speed; enabled: false if the backbone does not fit 8 GB
  cpu: {}

llm:
  toolbox: harness                        # the real gate, accountant and clock in front of every bank
  endpoint: null                          # null: --endpoint on the command line, else FTM_LLM_ENDPOINT
  model: null                             # served model name; null: the chosen E18 candidate's served_model
  serving_stack: null                     # vllm | llama.cpp, recorded in summary.json
  # Extra scripts/run_llm_agent.py arguments for EVERY LLM job (T3/T4 fill in before 31 Oct), e.g.
  #   ["--backtest", "data/backtest/hi_medium/<ns>/lr_table.jsonl", "--fusion-params", "outputs/fusion/params.json",
  #    "--library", "outputs/library/frozen.json"]
  common_args: []
  # seconds per alert on the reference machine (estimates for scheduling only; replace with the val-run medians)
  s_per_alert:
    default: 7.5                          # docs/t3_first_runs.md, Qwen3-8B
    ours: 7.5
    react: 8
    reflexion: 20
    rewoo: 6
    lats: 30
    llmcompiler: 8
    dspy_react: 8
    debate_autogen: 25
    uot: 10
    bed_llm: 14
    torres: 10
    sharma: 12
    co_investigator: 15
    finfre_rag: 8
  pin_gpu_s3: ["ours.compose.*"]          # job ids (fnmatch) that must run on the reference machine; the rest is balanced

ours:
  variants: [compose, fixed_list, act_only, no_backtest, llm_decides]   # planner modes (E3, E4, E9)
  extra_variants: []                      # e.g. [batched_2_1, library] (E11, E13); give their args in variant_args
  variant_args: {}                        # {batched_2_1: ["--batch-schedule", "2,1"], library: ["--library", "<frozen json>"]}

# T1: the command that writes data/alerts/{data}/test.parquet (alert-set schema of ftm/intake/README.md, split=test).
# Needed only if the file does not exist yet. It runs with FTM_FINAL_RUN=1, after the preflight.
test_alerts:
  path: data/alerts/{data}/test.parquet
  cmd: python scripts/make_alerts.py --data {data} --final    # also the `intake` step below, which has built it by then; formatted with {data} and {out}

external_cmd:
  # One command template per family, or one command per job (key: "system.variant" for both sets, or the full job id).
  templates:
    detection: python scripts/final_detection.py --system {system} --variant {variant} --data {data} --seed {seed} --alert-ids {alert_ids} --out {out} --run-id {run_id} --commit {commit} --machine {machine}  # T1: Groups A/B run logs from data/scores/<ds>/final/ (docs/t1_final_run.md)
    non_llm_arm: null                     # T2: the non-LLM planners and ablation arms (variant = the arm name in configs/experiments/ablations_nonllm.yaml)
  commands: {}                            # {"multi_gnn.see_everything": "python scripts/...", "nonllm.eig.subset": "..."}
  machine_class: {}                       # overrides: {"fraudgt.see_everything": gpu_s3}
  est_hours: {}                           # {"multi_gnn.see_everything": 3.0}
  default_est_hours: 0.5
  detection_est_hours: 0.1                # T1 groups A/B: the models are computed by the t1_final steps below; this job writes their run log

# T1's own final-run commands (docs/t1_final_run.md, "What scripts/run_final.py (T4) must call for T1"): the `--final` modes of
# T1's scripts, rows 1-10 of its table, in its order, each command a separate process (GPU jobs one at a time), FTM_FINAL_RUN=1 in the
# environment (set by run_final.py only). They train and tune nothing: every command reuses the validation hyper-parameters and checks
# inside the same pass that the val numbers are reproduced; if it exits non-zero its test scores must not be used (the step fails and the
# detection jobs that read them are blocked). Outputs go to data/scores/<ds>/final/, data/retrieval/<ds>/final/, data/runs/final_*.json.
#   phase: pre   runs BEFORE the frozen subset is drawn (they build the test alert set: GFP p0, then the conformal intake)
#          post  runs after the subset is frozen and hashed
#   cmds: no shell; a leading `python` is replaced by the interpreter that runs run_final.py. env: extra variables for the step's commands.
#   required: false steps may have no command yet (their absence does not stop the run or the manifest).
t1_final:
  steps:
    - id: gfp_one_bank          # row 1
      row: 1
      phase: pre
      machine_class: gpu_s1     # CPU-bound LightGBM on the 3070 Ti laptop; HI-Medium bank 70 alone took 2 h on val
      est_hours: 2.7
      cmds:
        - python scripts/train_gfp.py --data hi_small --mode one_bank --final
        - python scripts/train_gfp.py --data hi_medium --mode one_bank --final
    - id: gfp_see_everything    # row 2
      row: 2
      phase: pre
      machine_class: gpu_s1
      est_hours: 0.3
      cmds:
        - python scripts/train_gfp.py --data hi_small --mode see_everything --final
    - id: intake                # row 3: the test alert sets (alert_id F..., test_tail column); T1: t_alert fixed on val cal, not on test
      row: 3
      phase: pre
      machine_class: gpu_s1
      est_hours: 0.1
      depends_on: [gfp_one_bank]
      cmds:
        - python scripts/make_alerts.py --data hi_small --final
        - python scripts/make_alerts.py --data hi_medium --final
    - id: multi_gnn             # row 4: the val checkpoints re-scored, nothing trained
      row: 4
      phase: post
      machine_class: gpu_s1
      est_hours: 3.4
      cmds:
        - python scripts/train_gnn.py --final --model multi_gnn --data hi_small --mode one_bank
        - python scripts/train_gnn.py --final --model multi_gnn --data hi_medium --mode one_bank
        - python scripts/train_gnn.py --final --model multi_gnn --data hi_small --mode see_everything
    - id: mega_gnn              # row 5
      row: 5
      phase: post
      machine_class: gpu_s1
      est_hours: 3.4
      cmds:
        - python scripts/train_gnn.py --final --model mega_gnn --data hi_small --mode one_bank
        - python scripts/train_gnn.py --final --model mega_gnn --data hi_medium --mode one_bank
        - python scripts/train_gnn.py --final --model mega_gnn --data hi_small --mode see_everything
    - id: edge_scorer           # row 6
      row: 6
      phase: post
      machine_class: gpu_s1
      est_hours: 0.4
      cmds:
        - python -m ftm.retrieval.edge_scorer --data hi_small --final
        - python -m ftm.retrieval.edge_scorer --data hi_medium --final
    - id: explainers            # row 7 (CPU; GNNExplainer 1.4 s per alert)
      row: 7
      phase: post
      machine_class: gpu_s1
      est_hours: 2.6
      depends_on: [intake, multi_gnn, edge_scorer]
      cmds:
        - python scripts/run_explainers.py --data hi_small --final
        - python scripts/run_explainers.py --data hi_medium --final
    - id: evidence_views        # row 8 (CPU)
      row: 8
      phase: post
      machine_class: gpu_s1
      est_hours: 0.9
      depends_on: [intake, edge_scorer, explainers]
      cmds:
        - python -m ftm.retrieval.evidence_views --data hi_small --final --explainers gnnexplainer pgexplainer
        - python -m ftm.retrieval.evidence_views --data hi_medium --final --explainers gnnexplainer pgexplainer
    - id: federated             # row 9 (CPU): client-level arms are a fresh seeded noise draw (docs/t1_federated_eps.md)
      row: 9
      phase: post
      machine_class: gpu_s1
      est_hours: 2.3
      cmds:
        - python scripts/train_federated.py --final --data hi_small --unit client --eps 1 2 4 8 16 --seeds 0 1 2
        - python scripts/train_federated.py --final --data hi_small --unit edge --eps 1 2 4 8 --seeds 0 1 2
        - python scripts/train_federated.py --final --data hi_medium --unit client --eps 1 2 4 8 16 --seeds 0 1 2
        - python scripts/train_federated.py --final --data hi_medium --unit edge --eps 1 2 4 8 --seeds 0 1 2
    - id: layerwise             # row 10 (GPU; HI-Small full batch ~1.5 h, HI-Medium neighbour-sampled ~1.5 h: val 0.55 h per seed)
      row: 10
      phase: post
      machine_class: gpu_s1
      est_hours: 3.0
      cmds:
        - python scripts/train_layerwise.py --final --data hi_small --steps 480 --lr 6e-3 --arms sync_sgd:bwd --seeds 0 1 2
        - python scripts/train_layerwise.py --final --data hi_medium --steps 480 --lr 6e-3 --arms sync_sgd:bwd --seeds 0 1 2
    - id: fraudgt               # row 11: the val run's best.pt rescored in dump-only mode (no training), then the stored calibrator; 5070 Ti only
      row: 11
      phase: post
      machine_class: gpu_s3
      est_hours: 0.5
      required: true
      env: {T1_EVAL_TEST: "1"}  # per docs/t1_final_run.md: set by run_final.py only; the wrapper adds T1_DUMP_ONLY=1 and T1_OUT and refuses without this
      cmds:
        - python scripts/fraudgt_final.py   # needs best.pt + pred_val.csv of the val run in data/fraudgt/val_run (configs/t1_final/fraudgt.yaml: dump_dir)
    - id: hi_medium_see_everything   # row 12: needs val runs first (BLOCKED-COMPUTE); optional until they exist
      row: 12
      phase: post
      machine_class: gpu_s3
      est_hours: 3
      required: false           # the val runs (Akshat, 5070 Ti) must exist first: p0_hi_medium_<model>_see_everything.json and models/ (docs/t1_final_run.md, "When Akshat's files arrive")
      cmds:
        - python scripts/train_gfp.py --data hi_medium --mode see_everything --final
        - python scripts/train_gnn.py --final --model multi_gnn --data hi_medium --mode see_everything
        - python scripts/train_gnn.py --final --model mega_gnn --data hi_medium --mode see_everything

# Anything else that belongs in the final run (one bank only, GFP see-everything, raw sharing, ...):
extra_jobs: []
#  - {system: gfp, variant: one_bank, alerts: [subset, full_test], machine_class: cpu, est_hours: 0.3, owner: T1, tier: core,
#     cmd: "python scripts/...", depends_on: []}
