# T2's non-LLM arms in the final run (G5): where the arms get their question tables and fitted pieces.
# Read by ftm/orchestrator/final_nonllm.py and scripts/final_non_llm.py (the `non_llm_arm` command of configs/final/jobs.yaml).
# The ARMS and their settings are not here: they are the arms of configs/experiments/ablations_nonllm.yaml, built by the same code
# as the G4 table (ftm.orchestrator.ablations.prepare_arm), so the final run cannot drift from what was validated.
#
# Fill the paths in at G4 (30 Oct) from the back-test tables the G4 table was run on; `python scripts/final_non_llm.py --check`
# lists what is still missing. The tables are NOT rebuilt for the final run: the LRs were fixed on train alerts before test existed.

data: hi_medium         # the headline dataset; jobs.yaml `data` overrides it through --data

tables:                 # lr_table.jsonl written by `python scripts/backtest.py --assemble` (docs/t2_final_run.md)
  # headroom_v1 (rewrite of 1 Nov, docs/t3_headroom.md): the K=4 history-ledger back-test 7613b89b5dcc (440 hypotheses; e-BH accepts 6),
  # with every hypothesis of a family the tuned fusion uses marked accepted (field accepted_ebh keeps the e-BH verdict).  Frozen with
  # its hash in configs/fusion/headroom_v1_decisions.json.
  realistic: configs/fusion/headroom_v1_table.jsonl
  # the pre-rewrite table (K=1, confounded by time drift, audit finding 22), still loadable: data/backtest/{data}/7df6bad5337d/lr_table.jsonl
  # the e-BH-only version of the new table: configs/fusion/headroom_v1_accepted_table.jsonl
  # every DSL program up to size 3 over both subject slots plus the 110 expert programs (506 programs x eps 0.25/0.5/1/2 = 2024 hypotheses,
  # e-BH accepts 79), train alerts, same namespace as `realistic` (7613b89b5dcc); built 8 Nov, assembled by scripts/backtest.py --assemble
  enumerator: configs/fusion/enumerator_table.jsonl
  exact_labels: data/backtest/{data}/a829616cb2a1/lr_table.jsonl   # --exact-labels (T1, 8,396 alerts, 106 eligible, 16 accepted)

# A fitted learned policy (scripts/train_policy.py). null: the arm `learned_policy` fits it on the fit half of validation, as in G4.
policy: null

# headroom_v1 pieces for the arms that fuse (loaded by --fusion-params / the decision config); hashes in configs/fusion/headroom_v1_decisions.json
fusion_params: configs/fusion/headroom_v1.json        # ConditionalFusion: logit p0 (clipped 0.1) + shrink 0.5 * sum_f w_f * log LR_f
decision: configs/decision/headroom_v1.yaml           # threshold and cannot_cross bounds fitted on val fit+cal
eps_menu: [0.25, 0.5, 1.0, 2.0]                       # the chosen allocation: the planner is free to split the budget (EIG per unit eps)
