# T1 final-run config (week 12-13). Generated by scripts/make_t1_final_configs.py from the validation artefacts; nothing re-tuned, no test row read.
model: DP-FedAvg (Flower DP helpers + Opacus RDP accountant), tiny MLP (hidden 16)
arms:
  client:
    hi_small:
      commit: f5fb9ae
      delta: 1.0e-05
      features: ctx
      hyper:
        rounds: 10
        local_steps: 600
        lr: 0.5
        clip: 1.0
      q: 1.0
      epsilons:
      - 1.0
      - 16.0
      - 2.0
      - 4.0
      - 8.0
      - inf
      seeds:
      - 0
      - 1
      - 2
      clients: 30
      val_command: python scripts/train_federated.py --data hi_small --unit client --eps 1 2 4 8 16 --save-p0
    hi_medium:
      commit: db87a84
      delta: 1.0e-05
      features: ctx
      hyper:
        rounds: 10
        local_steps: 600
        lr: 0.5
        clip: 1.0
      q: 1.0
      epsilons:
      - 16.0
      - 8.0
      - inf
      seeds:
      - 0
      - 1
      - 2
      clients: 30
      val_command: python scripts/train_federated.py --data hi_medium --unit client --eps 1 2 4 8 16 --save-p0
  edge:
    hi_small:
      commit: f5fb9ae
      delta: 1.0e-05
      features: tx
      hyper:
        rounds: 10
        local_steps: 50
        lr: 0.5
        clip: 1.0
      q: 0.02
      epsilons:
      - 1.0
      - 2.0
      - 4.0
      - 8.0
      - inf
      seeds:
      - 0
      - 1
      - 2
      clients: 30
      val_command: python scripts/train_federated.py --data hi_small --unit edge --eps 1 2 4 8 16 --save-p0
    hi_medium:
      commit: 2e7d6f7
      delta: 1.0e-05
      features: tx
      hyper:
        rounds: 10
        local_steps: 50
        lr: 0.5
        clip: 1.0
      q: 0.02
      epsilons:
      - 8.0
      - inf
      seeds:
      - 0
      - 1
      - 2
      clients: 30
      val_command: python scripts/train_federated.py --data hi_medium --unit edge --eps 1 2 4 8 16 --save-p0
privacy_units:
  client: "one bank's whole dataset (\u03B5 per bank dataset, training)"
  edge: "one transaction (\u03B5 per transaction, training)"
report: docs/t1_federated_eps.md
figure: docs/figures/t1_federated_eps_<ds>.png
final_entry:
  status: ready
  commands:
  - python scripts/train_federated.py --final --data <ds> --unit client --eps 1 2 4 8 16 --seeds 0 1 2
  - python scripts/train_federated.py --final --data <ds> --unit edge --eps 1 2 4 8 --seeds 0 1 2
  note: run under scripts/run_final.py, the only place that sets FTM_FINAL_RUN; each `--final` refuses to run without it and checks that the val-time
    numbers are reproduced (docs/t1_final_run.md)
