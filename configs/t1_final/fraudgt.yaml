# T1 final-run config (week 12-13). Generated by scripts/make_t1_final_configs.py from the validation artefacts; nothing re-tuned, no test row read.
model: 'FraudGT SparseNodeGT+ports+Ego (Lin et al., ICAIF 2024; no licence: run from its checkout, never vendored)'
checkout: ~/Documents/t1_external/FraudGT
dump_dir: data/fraudgt/val_run
data_dir: ~/Documents/t1_external/fraudgt_data
commit: f88db9dc003a6f521a90631c4741541686043119
patch: ftm/baselines/fraudgt_t1.patch
config: configs/AML-Small-HI/AML-Small-HI-SparseNodeGT+ports+Ego.yaml
hyper:
  layers: 2
  hidden: 64
  heads: 8
  batch: 2048
  neighbours:
  - 50
  - 50
  optimizer: AdamW lr 1e-3, cosine, 5 warm-up epochs
  epochs: 500
  iter_per_epoch: 256
  seed: 42
val_result:
  status: val_done
  best_epoch: 291
  best_val_f1_random_subset: 0.68597
  commit: f25a6bb
  dump: data/fraudgt/val_run
  unscored_share: 0.002526089460230921
  calibration: isotonic
  val_eval:
    n: 234572
    n_pos: 304
    brier: 0.0006728482743706411
    pr_auc: 0.5893568642209006
    f1: 0.6627218934911243
status: val_done
external_command: T1_OUT=<dir> T1_METRICS=<dir>/metrics.jsonl T1_BUDGET_S=86400 python -m fraudGT.main --cfg configs/AML-Small-HI/AML-Small-HI-SparseNodeGT+ports+Ego.yaml
  --repeat 1 out_dir <dir> dataset.dir <data> wandb.use False
final_entry:
  status: ready
  commands:
  - python scripts/fraudgt_final.py
  external_final_command: T1_DUMP_ONLY=1 T1_EVAL_TEST=1 T1_OUT=<val run dir> python -m fraudGT.main --cfg configs/AML-Small-HI/AML-Small-HI-SparseNodeGT+ports+Ego.yaml
    --repeat 1 out_dir <val run dir>/final dataset.dir <data> wandb.use False
  note: '3070 Ti laptop (S1), where the val run ran: the val run (T1_OUT=<dir>, full 500 epochs) saves best.pt (best val F1) and pred_val.csv;
    the final run only rescores with best.pt, asserts pred_val.csv reproduces (< 1e-3) and writes pred_test.csv. T1_EVAL_TEST=1 is set by scripts/run_final.py
    only; the patch redirects every test evaluation to val unless it is set. `commands` is the wrapper: it runs that command with T1_DUMP_ONLY=1
    in the checkout, then scripts/fraudgt_scores.py --final (stored calibrator, p0 file). The val side: python scripts/fraudgt_scores.py --data
    hi_small --dump <val run dir>'
scores_file: data/scores/hi_small/p0_fraudgt.parquet
