# T1 final-run config (week 12-13). Generated by scripts/make_t1_final_configs.py from the validation artefacts; nothing re-tuned, no test row read.
config_file: configs/intake/conformal.yaml
common:
  alpha_clean: 0.02
  half_life_days: 0.25
  scrc_beta: 0.0005
  scrc_delta: 0.1
  apply_scrc: false
  fixed_window:
  - 0.15
  - 0.85
  seed: 0
  targets:
    train: 20000
    val_min: 1000
    test:
    - 2500
    - 4000
    test_pos_min: 375
datasets:
  hi_small:
    alpha_launder: 0.6
    bulk_days: 10
    thresholds_from_val_cal:
      t_launder: 0.03228574885484481
      t_clean: 0.0023080446667533053
      scrc_lambda: 0.0017735453376059767
      t_alert: 0.03228574885484481
      cleared_risk_ub: 0.0007841065002554677
    alerts_val: 1284
    command: python scripts/make_alerts.py --data hi_small
  hi_medium:
    alpha_launder: 0.63
    bulk_days: 16
    thresholds_from_val_cal:
      t_launder: 0.12917684416046393
      t_clean: 0.0030959752321981426
      scrc_lambda: 0.001513272201974385
      t_alert: 0.12917684416046393
      cleared_risk_ub: 0.0011499188053232666
    alerts_val: 2238
    command: python scripts/make_alerts.py --data hi_medium
alert_definition: launder in the Mondrian conformal prediction set, i.e. one-bank p0 >= t_alert; empty-set rows are not alerts and count as intake
  misses (decisions 2 and 5)
flags:
  spans_split: flag only, never a filter (decision 3)
  window_72h_rule: dropped (decision 3)
final_entry:
  status: ready
  commands:
  - python scripts/make_alerts.py --data <ds> --final
  note: run under scripts/run_final.py, the only place that sets FTM_FINAL_RUN; each `--final` refuses to run without it and checks that the val-time
    numbers are reproduced (docs/t1_final_run.md)
