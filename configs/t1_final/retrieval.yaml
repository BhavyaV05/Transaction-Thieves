# T1 final-run config (week 12-13). Generated by scripts/make_t1_final_configs.py from the validation artefacts; nothing re-tuned, no test row read.
edge_scorer:
  hi_small:
    seed: 0
    epochs: 120
    best_epoch_by_val_fit_ap: 111
    val_fit_ap: 0.2873166053213661
    val_eval_auc: 0.9928676920183326
    val_eval_ap: 0.22806700944335292
    neg_frac: 0.1
    features:
    - log_amount
    - ratio_paid_received
    - cur_recv
    - cur_pay
    - fmt
    - same_bank
    - hour
    - src_prior_out
    - dst_prior_in
    - src_prior_in
    - dst_prior_out
    - src_out_n
    - src_out_amt
    - src_in_n
    - src_in_amt
    - dst_out_n
    - dst_out_amt
    - dst_in_n
    - dst_in_amt
    - src_passthru
    - dst_passthru
    model_file: models/edge_scorer_hi_small.pt
    scores_file: data/retrieval/hi_small/edge_scores.parquet
  hi_medium:
    seed: 0
    epochs: 120
    best_epoch_by_val_fit_ap: 59
    val_fit_ap: 0.41802571322847076
    val_eval_auc: 0.9953234028273016
    val_eval_ap: 0.3935052554235457
    neg_frac: 0.1
    features:
    - log_amount
    - ratio_paid_received
    - cur_recv
    - cur_pay
    - fmt
    - same_bank
    - hour
    - src_prior_out
    - dst_prior_in
    - src_prior_in
    - dst_prior_out
    - src_out_n
    - src_out_amt
    - src_in_n
    - src_in_amt
    - dst_out_n
    - dst_out_amt
    - dst_in_n
    - dst_in_amt
    - src_passthru
    - dst_passthru
    model_file: models/edge_scorer_hi_medium.pt
    scores_file: data/retrieval/hi_medium/edge_scores.parquet
evidence_views:
  k: 40
  window_hours: 72
  edge_cost: 0.05
  pcst_bonus: 10.0
  evidence_tokens: 4000
  chars_per_token: 1.5
  views:
  - amount
  - scorer
  - scorer_pcst
  - long_prompt
  - amount_1hop
  - scorer_greedy
  - ppr
  - gnnexplainer
  - pgexplainer
  alias_seed: the run seed
  h6:
    statistic: pattern_edge_share(scorer_pcst) - pattern_edge_share(amount), denominator 40
    margin: 0.15
explainers:
  ppr_alpha: 0.15
  gnnexplainer_epochs: 100
  pgexplainer_epochs: 30
  pgexplainer_lr: 0.003
  pgexplainer_train_alerts_per_bank: 100
  target_class: laundering (1), no label read
  history_cap: 100
val_commands:
- python -m ftm.retrieval.evidence_views --data hi_small --parts cal eval --explainers gnnexplainer pgexplainer
- python -m ftm.retrieval.evidence_views --data hi_medium --parts cal eval --explainers gnnexplainer pgexplainer
final_entry:
  status: to_build
  command: python -m ftm.retrieval.evidence_views --data <ds> --final --explainers gnnexplainer pgexplainer
  note: proposed command (run under scripts/run_final.py, the only place that sets FTM_FINAL_RUN); the test-time entry point is not written yet,
    see docs/t1_final_run.md
