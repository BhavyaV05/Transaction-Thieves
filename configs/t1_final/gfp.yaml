# T1 final-run config (week 12-13). Generated by scripts/make_t1_final_configs.py from the validation artefacts; nothing re-tuned, no test row read.
model: GFP + LightGBM (snapml GraphFeaturePreprocessor)
split: train days / val days of configs/data/<ds>.yaml, test locked
features: GFP paper settings, 55-56 features (ftm/baselines/README.md)
final_entry:
  status: to_build
  command: python scripts/train_gfp.py --data <ds> --mode <one_bank|see_everything> --final
  note: proposed command (run under scripts/run_final.py, the only place that sets FTM_FINAL_RUN); the test-time entry point is not written yet,
    see docs/t1_final_run.md
