# T1 final-run config (week 12-13). Generated by scripts/make_t1_final_configs.py from the validation artefacts; nothing re-tuned, no test row read.
model: MEGA-GenAgg (GIN, GenAgg node aggregation, GIN parallel-edge aggregation, edge updates, reverse MP, ego ids, no ports); hcagri/MEGA-GNN
  commit ef60a71
final_entry:
  status: ready
  commands:
  - python scripts/train_gnn.py --final --model mega_gnn --data <ds> --mode one_bank
  - python scripts/train_gnn.py --final --model mega_gnn --data <ds> --mode see_everything
  note: run under scripts/run_final.py, the only place that sets FTM_FINAL_RUN; each `--final` refuses to run without it and checks that the val-time
    numbers are reproduced (docs/t1_final_run.md)
