# T1 final-run config (week 12-13). Generated by scripts/make_t1_final_configs.py from the validation artefacts; nothing re-tuned, no test row read.
model: MEGA-GenAgg (GIN, GenAgg node aggregation, GIN parallel-edge aggregation, edge updates, reverse MP, ego ids, no ports); hcagri/MEGA-GNN
  commit ef60a71
final_entry:
  status: to_build
  command: python scripts/train_gnn.py --final --model mega_gnn --data <ds> --mode <one_bank|see_everything>
  note: proposed command (run under scripts/run_final.py, the only place that sets FTM_FINAL_RUN); the test-time entry point is not written yet,
    see docs/t1_final_run.md
hi_small:
  one_bank:
    status: not_run
    val_command: python scripts/train_gnn.py --our-split --model mega_gnn --data hi_small --mode one_bank --max-epochs 100 --budget-s 28800
  see_everything:
    status: not_run
    val_command: python scripts/train_gnn.py --our-split --model mega_gnn --data hi_small --mode see_everything --max-epochs 100 --budget-s 28800
hi_medium:
  one_bank:
    status: not_run
    val_command: python scripts/train_gnn.py --our-split --model mega_gnn --data hi_medium --mode one_bank --max-epochs 100 --budget-s 28800
  see_everything:
    status: blocked_compute
    val_command: python scripts/train_gnn.py --our-split --model mega_gnn --data hi_medium --mode see_everything --max-epochs 100 --budget-s 28800
