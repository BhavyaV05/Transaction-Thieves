model: MEGA-GenAgg (GIN, GenAgg node aggregation, GIN parallel-edge aggregation, edge updates, reverse MP, ego ids, no ports); hcagri/MEGA-GNN
  commit ef60a71
final_entry:
  status: ready
  commands:
  - python scripts/train_gnn.py --final --model mega_gnn --data <ds> --mode one_bank
  - python scripts/train_gnn.py --final --model mega_gnn --data <ds> --mode see_everything
