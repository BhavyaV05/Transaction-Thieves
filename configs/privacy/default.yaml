protection_unit: transaction     # adjacency = add or remove one transaction
eps_per_alert: 2.0
eps_sweep: [0.5, 1.0, 2.0, 4.0, null]   # null = no noise
per_account_cap: 8.0                     # 4x eps_per_alert, so an account can be the subject of 4 full-budget alerts. E14 sweeps it. Placeholder until T1's test-alert projection shows how often accounts repeat
eps_cal: null                            # back-testing budget, reported separately (null = tracked, not capped; T2 sets it at G2)
composition: basic                       # summed eps
